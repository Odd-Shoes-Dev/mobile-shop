<style>/* ERISAF design system. Tokens first; everything else uses them. */
:root{
  --yellow:#FFD400; --black:#000; --white:#fff; --grey:#E6E6E1; --slate:#595954;
  --bd:3px solid var(--black); --sh:4px 4px 0 var(--black); --sh-sm:2px 2px 0 var(--black);
  --r:14px; --r-sm:8px;
  --display:"Archivo Black","Arial Black",Impact,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:clamp(16px,4vw,48px);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font:400 1rem/1.5 var(--body);color:var(--black);background:var(--white);-webkit-text-size-adjust:100%}
img,svg{max-width:100%;display:block} a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,9vw,5.5rem)} h2{font-size:clamp(1.9rem,6vw,3.6rem)} h3{font-size:1.25rem;line-height:1.05} h4{font-size:1rem}
p{margin:0 0 .75rem} .muted{color:var(--slate)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--black);outline-offset:3px;box-shadow:0 0 0 6px var(--yellow)}
.skip{position:absolute;left:-999px;top:8px;background:var(--yellow);padding:8px 12px;border:var(--bd);z-index:99} .skip:focus{left:8px}
.sample-bar{background:var(--black);color:var(--yellow);text-align:center;font-size:.85rem;padding:6px 10px;font-weight:700}

/* header */
.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px var(--pad);background:var(--white);border-bottom:var(--bd)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand__mark{width:40px;height:40px;background:var(--black);color:var(--yellow);display:grid;place-items:center;font:1.5rem var(--display);border-radius:50% 50% 50% 8px;transform:rotate(-6deg)}
.brand__txt{font:1.25rem/1 var(--display)} .brand__txt small{display:block;font:.6rem/1.2 var(--body);font-weight:700;letter-spacing:.12em}
.nav{display:none;gap:2px;margin-left:auto;background:var(--black);border-radius:99px;padding:5px} .nav a{font-weight:700;text-decoration:none;padding:8px 14px;border-radius:99px;color:var(--white)} .nav a:hover{background:var(--yellow);color:var(--black)}
.search{display:flex;gap:6px;flex:1 1 100%;order:5} .search input{flex:1;min-width:0;border:var(--bd);border-radius:99px;padding:8px 14px;font:inherit;background:var(--white)}
.cartbtn{margin-left:auto;font:700 1rem var(--body);background:var(--yellow);color:var(--black);border:var(--bd);border-radius:99px;padding:10px 16px;cursor:pointer;min-height:44px}
.cartbtn b,.bottombar b{background:var(--black);color:var(--yellow);border-radius:99px;padding:0 7px;margin-left:4px}
@media(min-width:900px){.nav{display:flex}.search{flex:0 1 240px;order:0;margin-left:0}.cartbtn{margin-left:0}}

/* mobile bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--black);border-top:var(--bd)}
.bottombar a,.bottombar button{flex:1;color:var(--white);text-align:center;text-decoration:none;font:700 .85rem var(--body);padding:14px 4px;background:none;border:0;min-height:48px;cursor:pointer}
.bottombar a.on{color:var(--yellow)} .bottombar b{background:var(--yellow);color:var(--black)}
@media(min-width:900px){.bottombar{display:none}}
main{min-height:70vh;padding-bottom:72px} @media(min-width:900px){main{padding-bottom:0}}
main:focus{outline:none}

/* buttons, chips, stickers */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:400 1rem/1 var(--display);text-transform:uppercase;text-decoration:none;background:var(--yellow);color:var(--black);border:var(--bd);border-radius:99px;padding:14px 22px;min-height:48px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:var(--sh-sm)} .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--black)}
.btn--dark{background:var(--black);color:var(--yellow);box-shadow:4px 4px 0 var(--yellow);border-color:var(--black)}
.btn--white{background:var(--white)} .btn--sm{padding:8px 14px;min-height:40px;font-size:.85rem;box-shadow:var(--sh-sm)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.chip{font:700 .9rem var(--body);background:var(--white);border:2px solid var(--black);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed=true],.chip.on{background:var(--black);color:var(--yellow)}
.pill{display:inline-block;font:700 .75rem var(--body);border:2px solid var(--black);border-radius:99px;padding:2px 9px;background:var(--white)}
.pill--in{background:var(--yellow)} .pill--out{background:var(--grey);text-decoration:line-through}
.sticker{display:inline-block;background:var(--white);border:var(--bd);box-shadow:var(--sh-sm);padding:8px 12px;font:700 .9rem/1.2 var(--body);transform:rotate(-3deg);border-radius:var(--r-sm)}
.sticker--y{background:var(--yellow)} .sticker--k{background:var(--black);color:var(--yellow)}
.bubble{position:relative;display:inline-block;background:var(--white);border:var(--bd);border-radius:var(--r);padding:10px 14px;font-weight:700;box-shadow:var(--sh-sm)}
.bubble::after{content:"";position:absolute;left:24px;bottom:-14px;width:18px;height:18px;background:var(--white);border-right:var(--bd);border-bottom:var(--bd);transform:rotate(45deg) skew(10deg,10deg)}
.burst{display:grid;place-items:center;text-align:center;width:112px;height:112px;background:var(--black);color:var(--yellow);font:.8rem/1.1 var(--display);text-transform:uppercase;padding:14px;clip-path:polygon(50% 0,61% 14%,79% 7%,80% 25%,98% 30%,88% 46%,100% 60%,83% 68%,86% 87%,67% 84%,57% 100%,45% 86%,27% 95%,23% 76%,5% 72%,15% 55%,2% 40%,20% 33%,18% 13%,38% 18%)}

/* sections */
.sec{padding:clamp(40px,8vw,96px) var(--pad);position:relative}
.sec--y{background:var(--yellow)} .sec--k{background:var(--black);color:var(--white)} .sec--g{background:var(--grey)}
.sec--dots{background-image:radial-gradient(rgba(0,0,0,.16) 1.3px,transparent 1.5px);background-size:11px 11px}
.sec--k h2,.sec--k h3{color:var(--yellow)} .sec--k .muted{color:#c9c9c4}
.sec__head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:28px}
.sec__head p{max-width:46ch;margin:0}
.wrap{max-width:1240px;margin:0 auto}

/* hero */
.hero{background:var(--yellow);padding:clamp(28px,5vw,64px) var(--pad) 0;overflow:hidden;border-bottom:var(--bd)}
.hero__grid{display:grid;gap:24px;max-width:1240px;margin:0 auto}
.hero h1{font-size:clamp(2.6rem,12.5vw,8rem);line-height:.88}
.hero h1 span{display:inline-block}
.hl1{color:var(--black)} .hl2{background:var(--black);color:var(--yellow);padding:.04em .16em;margin:.06em 0;transform:rotate(-1.5deg)} .hl3{background:var(--white);border:var(--bd);padding:.02em .16em;transform:rotate(1.2deg);box-shadow:var(--sh)}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 18px}
.hero__art{position:relative;min-height:280px;align-self:end}
.hero__art .big{width:min(560px,100%);margin:0 auto;transform:rotate(-5deg)}
.hero__art .s1{position:absolute;left:0;top:6px;z-index:2} .hero__art .s2{position:absolute;right:0;bottom:70px;z-index:2;transform:rotate(4deg)}
.hero__art .mini{position:absolute;width:30%;min-width:96px} .hero__art .m1{left:2%;bottom:6px;transform:rotate(-8deg)} .hero__art .m2{right:4%;bottom:2px;transform:rotate(7deg)}
@media(min-width:900px){.hero__grid{grid-template-columns:1.25fr 1fr;align-items:end}.hero__art{min-height:460px}}
.ticker{background:var(--black);color:var(--yellow);overflow:hidden;white-space:nowrap;border-bottom:var(--bd)}
.ticker div{display:inline-block;padding:12px 0;font:1.3rem var(--display);animation:tick 28s linear infinite} .ticker span{margin:0 22px}
@keyframes tick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker div{animation:none}*{transition:none!important;scroll-behavior:auto!important}}

/* mission bento */
.bento{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:170px;padding:16px;text-decoration:none;border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);background:var(--white);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translate(2px,2px);box-shadow:var(--sh-sm)}
.tile h3{font-size:clamp(1.5rem,5vw,2.6rem)} .tile p{margin:0;font-weight:700} .tile svg{width:64px;height:48px}
.tile--k{background:var(--black);color:var(--yellow);box-shadow:4px 4px 0 var(--white)} .tile--y{background:var(--yellow)} .tile--g{background:var(--grey)}
@media(min-width:760px){.bento{grid-template-columns:repeat(6,1fr)}.tile{grid-column:span 2}.tile.w3{grid-column:span 3}.tile.w2{grid-column:span 2}.tile.big{grid-column:span 3;min-height:260px}}

/* product art + cards */
.art{position:relative;background:var(--grey);border:var(--bd);border-radius:var(--r-sm);aspect-ratio:10/7;display:grid;place-items:center;overflow:hidden}
.art svg,.art img{width:84%;height:84%;object-fit:contain}
.art .tag-sample{position:absolute;left:6px;top:6px;background:var(--black);color:var(--yellow);font:700 .65rem var(--body);padding:2px 7px;border-radius:99px;letter-spacing:.04em}
.card{display:flex;flex-direction:column;gap:10px;background:var(--white);border:var(--bd);border-radius:var(--r);padding:12px;box-shadow:var(--sh);min-width:0}
.card h3 a{text-decoration:none} .card h3 a:hover{text-decoration:underline}
.card__meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.price{font:1.35rem/1 var(--display)} .price s{font:400 .9rem var(--body);color:var(--slate);margin-right:6px} .save{font:700 .75rem var(--body);background:var(--yellow);border:2px solid #000;border-radius:99px;padding:1px 8px}
.card__actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.specs-mini{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none} .specs-mini li{font-size:.8rem;font-weight:700;background:var(--grey);border-radius:6px;padding:2px 8px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rail{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 18px;margin:0 calc(var(--pad)*-1);padding-inline:var(--pad);scroll-snap-type:x mandatory}
.rail>*{flex:0 0 min(78vw,290px);scroll-snap-align:start}
.why{margin:0;padding-left:1.1em;font-size:.88rem} .why li{margin:2px 0}

/* inline tools */
.tool{background:var(--white);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(14px,3vw,28px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:grid;gap:4px;margin-bottom:12px} .field label{font-weight:700}
.field input,.field select,.field textarea,select.sel{font:inherit;border:var(--bd);border-radius:var(--r-sm);padding:10px 12px;background:var(--white);min-height:46px;width:100%}
input[type=range]{width:100%;accent-color:#000;height:36px}
.bigbudget{font:clamp(2rem,9vw,4.5rem)/1 var(--display)}

/* versus */
.vs{display:grid;gap:12px;grid-template-columns:1fr auto 1fr;align-items:center}
.vs .burst{width:84px;height:84px;font-size:.9rem}
@media(max-width:560px){.vs{grid-template-columns:1fr 1fr}.vs .burst{display:none}}
.bar{height:12px;background:var(--grey);border:2px solid #000;border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--yellow);border-right:2px solid #000}
.win{background:var(--yellow);box-shadow:inset 0 0 0 2px #000}

/* compare table */
.tablewrap{overflow-x:auto;border:var(--bd);border-radius:var(--r);background:var(--white);box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:560px} table.cmp th,table.cmp td{padding:12px;text-align:left;vertical-align:top;border-bottom:2px solid var(--grey);min-width:150px}
table.cmp th:first-child,table.cmp td:first-child{position:sticky;left:0;background:var(--white);font-weight:700;min-width:96px;border-right:2px solid var(--black);z-index:1}
.verdict{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:20px}
.verdict .v{border:var(--bd);border-radius:var(--r);background:var(--white);padding:14px;box-shadow:var(--sh)} .verdict .v b{font:1.05rem/1.1 var(--display);text-transform:uppercase;display:block;margin-bottom:6px}
.verdict .v.is-win{background:var(--yellow)}

/* quiz */
.quiz{max-width:880px;margin:0 auto}
.progress{height:16px;border:var(--bd);border-radius:99px;background:var(--white);overflow:hidden;margin:8px 0 24px} .progress i{display:block;height:100%;background:var(--black);transition:width .25s}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.choice{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--white);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;font:inherit;cursor:pointer;min-height:110px}
.choice:hover{background:var(--yellow)} .choice b{font:1.15rem/1 var(--display);text-transform:uppercase} .choice svg{width:56px;height:40px}

/* product page */
.pdp{display:grid;gap:24px;max-width:1240px;margin:0 auto} @media(min-width:900px){.pdp{grid-template-columns:1.1fr 1fr}}
.pdp .art{aspect-ratio:10/8}
.benefits{display:grid;gap:10px;padding:0;margin:0;list-style:none} .benefits li{border-left:6px solid var(--yellow);background:var(--white);padding:8px 12px;border-top:2px solid #000;border-right:2px solid #000;border-bottom:2px solid #000}
table.spec{width:100%;border-collapse:collapse;background:var(--white)} table.spec th,table.spec td{padding:9px 10px;border-bottom:2px solid var(--grey);text-align:left;vertical-align:top} table.spec th{width:38%;font-weight:700}
.ctxbtns{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.compat{display:flex;align-items:center;gap:8px;font-size:.85rem} .compat.ok{color:#000} .dot{width:12px;height:12px;border-radius:50%;border:2px solid #000;flex:none} .dot.ok{background:var(--yellow)} .dot.no{background:#000} .dot.unknown{background:var(--white)}
details.faq{border:var(--bd);border-radius:var(--r-sm);background:var(--white);padding:10px 14px;margin-bottom:10px} details.faq summary{font-weight:700;cursor:pointer;min-height:32px}
.notice{border:var(--bd);border-radius:var(--r);padding:14px;background:var(--white)} .notice--y{background:var(--yellow)}
.empty{border:3px dashed #000;border-radius:var(--r);padding:24px;text-align:center;background:var(--white)}

/* setup */
.slot{display:grid;gap:10px;grid-template-columns:100px 1fr;align-items:start;border:var(--bd);border-radius:var(--r);background:var(--white);padding:10px;box-shadow:var(--sh)} .slot .art{aspect-ratio:1}
.totalbar{position:sticky;bottom:60px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--black);color:var(--yellow);border:var(--bd);border-radius:var(--r);padding:12px 16px;box-shadow:4px 4px 0 var(--yellow)}
@media(min-width:900px){.totalbar{bottom:12px}}

/* cart drawer, scrim, toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--white);border-left:var(--bd);z-index:60;display:flex;flex-direction:column}
.drawer__head,.drawer__foot{padding:14px;border-bottom:var(--bd);display:flex;justify-content:space-between;align-items:center} .drawer__foot{border-top:var(--bd);border-bottom:0;flex-direction:column;align-items:stretch;gap:10px}
.drawer__body{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.line{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start} .line .art{aspect-ratio:1}
.qty{display:inline-flex;align-items:center;border:2px solid #000;border-radius:99px} .qty button{width:36px;height:36px;border:0;background:none;font:700 1.1rem var(--body);cursor:pointer} .qty span{min-width:24px;text-align:center;font-weight:700}
.x{border:0;background:none;font-size:2rem;line-height:1;cursor:pointer;min-width:44px;min-height:44px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;background:var(--black);color:var(--yellow);padding:10px 18px;border-radius:99px;font-weight:700;border:var(--bd);max-width:92vw}

/* assistant */
.fab{position:fixed;right:14px;bottom:70px;z-index:40;display:flex;align-items:center;gap:6px;background:var(--black);color:var(--yellow);border:var(--bd);border-color:var(--yellow);border-radius:99px;padding:10px 16px;font:400 1rem var(--display);cursor:pointer;min-height:48px;box-shadow:var(--sh-sm)}
@media(min-width:900px){.fab{bottom:18px}}
.panel{position:fixed;z-index:70;right:0;bottom:0;width:min(440px,100%);height:min(78vh,680px);background:var(--white);border:var(--bd);border-radius:var(--r) var(--r) 0 0;display:flex;flex-direction:column;box-shadow:var(--sh)}
@media(min-width:900px){.panel{right:18px;bottom:18px;border-radius:var(--r)}}
.panel__head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;background:var(--yellow);border-bottom:var(--bd);border-radius:11px 11px 0 0}
.modebadge{font-size:.75rem;font-weight:700} .modebadge.demo{background:var(--black);color:var(--yellow);display:inline-block;padding:1px 8px;border-radius:99px}
.panel__ctx{padding:6px 14px;font-size:.85rem;background:var(--grey);border-bottom:2px solid #000}
.panel__log{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.msg{max-width:92%;padding:9px 12px;border:2px solid #000;border-radius:14px;white-space:pre-wrap} .msg.user{justify-self:end;background:var(--yellow)} .msg.bot{background:var(--white)}
.mini-card{display:grid;grid-template-columns:72px 1fr;gap:10px;border:2px solid #000;border-radius:12px;padding:8px;background:var(--white)} .mini-card .art{aspect-ratio:1;border-width:2px}
.panel__chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.panel__form{display:flex;gap:8px;padding:10px;border-top:var(--bd)} .panel__form input{flex:1;min-width:0;border:var(--bd);border-radius:99px;padding:10px 14px;font:inherit}
.typing{font-style:italic;color:var(--slate)}
footer.foot{background:var(--black);color:var(--white);padding:32px var(--pad)} footer.foot a{color:var(--yellow)}

.brand img{height:40px;width:auto} @media(min-width:900px){.brand img{height:48px}}
.infobar{background:var(--yellow);display:flex;justify-content:center;gap:clamp(12px,4vw,40px);flex-wrap:wrap;padding:6px var(--pad);font:700 .8rem var(--body);border-bottom:2px solid #000}
.infobar a{text-decoration:underline}
.mascot{mix-blend-mode:multiply}
[hidden]{display:none!important}
/* fallback-safe display weight: Archivo Black is single-weight; if it fails to load, system bold takes over */
h1,h2,h3,h4,.btn,.price,.brand__txt,.burst,.choice b,.verdict .v b,.tile h3,.bigbudget,.fab,.ticker div,.panel__head b{font-weight:900;font-synthesis-weight:none}
.hero h1{font-size:clamp(2.3rem,10.5vw,4.6rem);line-height:.9} @media(min-width:900px){.hero h1{font-size:clamp(3rem,5.6vw,5.4rem)}}
.infobar{display:none} @media(min-width:900px){.infobar{display:flex}}
.hero__cta{display:grid;grid-template-columns:1fr 1fr} .hero__cta .btn{padding:12px 14px;font-size:.9rem;text-align:center}
@media(min-width:700px){.hero__cta{display:flex;flex-wrap:wrap}.hero__cta .btn{font-size:1rem;padding:14px 22px}}
@media(min-width:900px){.nav a{padding:8px 10px;font-size:.95rem}.search{flex:0 1 190px}.top{flex-wrap:nowrap}}
.cartbtn{white-space:nowrap}
.hero__art .m1{width:40%;min-width:150px;left:0;bottom:0;z-index:3;transform:rotate(-4deg)}
.hero__art .m2{z-index:1}
.hero__art .s2{width:124px;height:124px}
.tile svg{background:var(--white);border:3px solid #000;border-radius:10px;padding:4px;width:76px;height:56px}
</style>
</head>

<script>/* Shared catalogue logic: runs in the browser AND in Node (server/assistant.js).
   Everything here is deterministic and works only from catalogue data. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ERI = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const clip = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const has = (v) => v !== null && v !== undefined && !Number.isNaN(v);
  const fmt = (n) => (has(n) ? 'UGX ' + Math.round(n).toLocaleString('en-US') : 'Not listed');
  const priceOf = (p) => (has(p.discountPrice) && p.discountPrice < p.price ? p.discountPrice : p.price);
  const spec = (p, k) => (p.specs && p.specs[k]) || null;

  function availability(p) {
    if (p.availability === 'out_of_stock' || p.stock === 0) return { key: 'out', label: 'Out of stock' };
    if (p.availability === 'preorder') return { key: 'pre', label: 'Pre-order' };
    if (p.availability === 'in_stock' || (has(p.stock) && p.stock > 0)) return { key: 'in', label: 'In stock' };
    return { key: 'unknown', label: 'Ask us about availability' };
  }

  /* ---------- natural-language helpers ---------- */
  function parseBudget(text) {
    const t = String(text).toLowerCase().replace(/,/g, '');
    let m = t.match(/(\d+(?:\.\d+)?)\s*(million|mil|m)\b/);
    if (m) return Math.round(parseFloat(m[1]) * 1e6);
    m = t.match(/(\d+(?:\.\d+)?)\s*(k|thousand)\b/);
    if (m) return Math.round(parseFloat(m[1]) * 1e3);
    m = t.match(/\b(\d{6,9})\b/);
    if (m) return parseInt(m[1], 10);
    return null;
  }
  const USE_WORDS = {
    gaming: /\b(game|gaming|gamer|fortnite|fifa|pubg|call of duty|esports?|play games)\b/,
    create: /\b(edit|editing|video|photo|design|designer|music|produc(e|tion)|premiere|photoshop|creator|content|3d|render|animation|illustrat\w+|studio)\b/,
    study: /\b(student|study|studying|school|university|campus|class|assignment|learning|homework)\b/,
    work: /\b(office|work|business|excel|accounts?|accounting|productivity|spreadsheet|emails?|zoom|meetings?)\b/,
  };
  function parseUse(text) {
    const t = String(text).toLowerCase();
    for (const k of ['gaming', 'create', 'study', 'work']) if (USE_WORDS[k].test(t)) return k;
    return null;
  }
  const CATS = {
    laptop: /\b(laptops?|notebooks?|computers?)\b/, mouse: /\b(mouse|mice)\b/, keyboard: /\bkeyboards?\b/,
    headphones: /\b(headphones?|headsets?|earphones?)\b/, monitor: /\b(monitors?|screens?|displays?)\b/,
    bag: /\b(bags?|backpacks?|sleeves?)\b/, storage: /\b(storage|ssd|hard ?drive|flash|external drive)\b/,
    cooling: /\b(cool(ing|er)|cooling pad|fan)\b/,
  };
  function parseCategory(text) {
    const t = String(text).toLowerCase();
    for (const k of Object.keys(CATS)) if (CATS[k].test(t)) return k;
    return null;
  }

  /* ---------- scoring (used for quiz, missions, assistant demo, verdicts) ---------- */
  function parts(p) {
    const m = p.metrics || {};
    return {
      cpu: has(m.cpuTier) ? m.cpuTier / 5 : null,
      gpu: has(m.gpuTier) ? m.gpuTier / 5 : null,
      ram: has(m.ramGB) ? clip(m.ramGB / 16) : null,
      sto: has(m.storageGB) ? clip(m.storageGB / 1000) : null,
      bat: has(m.batteryHrs) ? clip(m.batteryHrs / 12) : null,
      light: has(m.weightKg) ? clip((2.5 - m.weightKg) / 1.3) : null,
      value: has(p.price) ? clip(1 - priceOf(p) / 5000000) : null,
      disp: has(m.displayInches) ? clip(m.displayInches / 16) : null,
    };
  }
  const WEIGHTS = {
    gaming: { gpu: 0.6, cpu: 0.2, ram: 0.1, sto: 0.1 },
    create: { cpu: 0.3, ram: 0.25, gpu: 0.15, sto: 0.15, disp: 0.15 },
    study: { value: 0.35, bat: 0.3, light: 0.2, cpu: 0.15 },
    work: { bat: 0.3, cpu: 0.25, ram: 0.2, light: 0.15, value: 0.1 },
  };
  function fitScore(p, use, priority) {
    if (p.category !== 'laptop') return (p.useCases || []).includes(use) ? 0.6 : 0.3;
    const w = Object.assign({}, WEIGHTS[use] || { cpu: 0.3, ram: 0.2, bat: 0.2, value: 0.3 });
    if (priority === 'portable') { w.bat = (w.bat || 0) + 0.25; w.light = (w.light || 0) + 0.25; }
    if (priority === 'performance') { w.cpu = (w.cpu || 0) + 0.2; w.gpu = (w.gpu || 0) + 0.2; w.ram = (w.ram || 0) + 0.1; }
    const q = parts(p);
    let s = 0, tw = 0;
    for (const k in w) if (q[k] !== null && q[k] !== undefined) { s += w[k] * q[k]; tw += w[k]; }
    return tw ? s / tw : 0;
  }

  /* Plain-language reasons, only from fields that are actually listed. */
  function reasons(p, use, budget) {
    const m = p.metrics || {}, out = [];
    if (p.category === 'laptop') {
      if (use === 'gaming') {
        if (has(m.gpuTier) && m.gpuTier >= 3) out.push(`Dedicated graphics (${spec(p, 'Graphics') || 'listed GPU'}) for smoother games`);
        else if (has(m.gpuTier)) out.push(`Integrated graphics (${spec(p, 'Graphics') || 'shared'}): fine for light games, not demanding ones`);
        if (has(m.ramGB) && m.ramGB >= 16) out.push(`${m.ramGB}GB RAM keeps games and background apps running together`);
      } else if (use === 'create') {
        if (has(m.ramGB)) out.push(m.ramGB >= 16 ? `${m.ramGB}GB RAM gives editing software room to breathe` : `${m.ramGB}GB RAM is the minimum for editing; expect slower timelines`);
        if (spec(p, 'Processor')) out.push(`Processor: ${spec(p, 'Processor')}`);
        if (spec(p, 'Storage')) out.push(`Storage: ${spec(p, 'Storage')} for project files`);
        if (has(m.gpuTier) && m.gpuTier >= 3) out.push(`Dedicated graphics (${spec(p, 'Graphics')}) helps video effects and exports`);
      } else if (use === 'study') {
        if (has(m.batteryHrs)) out.push(`Listed battery life of about ${m.batteryHrs} hours for lectures away from sockets`);
        if (has(m.weightKg)) out.push(`${m.weightKg}kg: ${m.weightKg <= 1.7 ? 'easy to carry daily' : 'noticeable in a bag'}`);
      } else {
        if (has(m.batteryHrs)) out.push(`About ${m.batteryHrs} hours listed battery life`);
        if (has(m.ramGB)) out.push(`${m.ramGB}GB RAM for spreadsheets, browsers and video calls together`);
        if (has(m.weightKg)) out.push(`${m.weightKg}kg`);
      }
    } else {
      if ((p.useCases || []).includes(use)) out.push(`Tagged for ${use === 'create' ? 'creative' : use} use in the catalogue`);
      if (p.description) out.push(p.description.split('. ')[0].replace(/\.$/, ''));
    }
    if (has(budget)) {
      const diff = budget - priceOf(p);
      if (diff >= 0) out.push(`Within your budget with ${fmt(diff)} to spare`);
      else out.push(`${fmt(-diff)} over your budget`);
    }
    return out.slice(0, 4);
  }

  /* ---------- search / filtering ---------- */
  function search(catalogue, q) {
    const toks = String(q).toLowerCase().split(/[^a-z0-9.]+/).filter((t) => t.length > 1);
    if (!toks.length) return [];
    return catalogue
      .map((p) => {
        const hay = [p.name, p.brand, p.category, p.description, (p.keywords || []).join(' '), (p.useCases || []).join(' ')].join(' ').toLowerCase();
        let s = 0;
        for (const t of toks) if (hay.includes(t)) s += p.name.toLowerCase().includes(t) ? 3 : 1;
        return { p, s };
      })
      .filter((x) => x.s > 0)
      .sort((a, b) => b.s - a.s)
      .map((x) => x.p);
  }

  function rank(catalogue, { use, budget, category = 'laptop', priority, brand, stretch = 1.0, includeOut = false } = {}) {
    let list = catalogue.filter((p) => p.category === category);
    if (!includeOut) list = list.filter((p) => availability(p).key !== 'out');
    if (has(budget)) list = list.filter((p) => has(p.price) && priceOf(p) <= budget * stretch);
    if (brand && brand !== 'any') list = list.filter((p) => p.brand.toLowerCase() === String(brand).toLowerCase());
    return list
      .map((p) => ({ p, score: fitScore(p, use, priority) }))
      .sort((a, b) => b.score - a.score || priceOf(a.p) - priceOf(b.p))
      .map((x) => x.p);
  }

  /* ---------- compatibility (only where data exists) ---------- */
  function compat(laptop, acc) {
    const L = laptop.metrics || {}, A = acc.metrics || {};
    if (acc.category === 'bag' || acc.category === 'cooling') {
      if (has(A.fitsInches) && has(L.displayInches)) {
        return A.fitsInches >= L.displayInches
          ? { status: 'ok', note: `Fits laptops up to ${A.fitsInches}"; this one is ${L.displayInches}"` }
          : { status: 'no', note: `Made for up to ${A.fitsInches}"; this laptop is ${L.displayInches}"` };
      }
      return { status: 'unknown', note: 'Size data missing for one of the two products' };
    }
    if (acc.category === 'monitor') {
      if (Array.isArray(A.inputs) && Array.isArray(L.ports)) {
        const shared = A.inputs.filter((i) => L.ports.includes(i));
        return shared.length
          ? { status: 'ok', note: `Connects with a ${shared[0].toUpperCase()} cable (cable not included unless listed)` }
          : { status: 'no', note: 'No matching video port listed on both products' };
      }
      return { status: 'unknown', note: 'Port data missing for one of the two products' };
    }
    if (Array.isArray(A.connection) && Array.isArray(L.ports)) {
      const shared = A.connection.filter((i) => L.ports.includes(i));
      return shared.length
        ? { status: 'ok', note: `Connects via ${shared[0]}` }
        : { status: 'no', note: `Needs ${A.connection.join(' or ')}; laptop lists ${L.ports.join(', ')}` };
    }
    return { status: 'unknown', note: 'Connection data not listed' };
  }
  function accessoriesFor(laptop, catalogue) {
    return catalogue
      .filter((p) => p.category !== 'laptop' && availability(p).key !== 'out')
      .map((p) => Object.assign({ p }, compat(laptop, p)));
  }

  /* ---------- head-to-head ---------- */
  const ROWS = [
    { label: 'Price', get: (p) => fmt(priceOf(p)), metric: (p) => priceOf(p), best: 'low' },
    { label: 'Processor', get: (p) => spec(p, 'Processor') || 'Not listed', metric: (p) => p.metrics && p.metrics.cpuTier, best: 'high' },
    { label: 'RAM', get: (p) => spec(p, 'RAM') || 'Not listed', metric: (p) => p.metrics && p.metrics.ramGB, best: 'high' },
    { label: 'Storage', get: (p) => spec(p, 'Storage') || 'Not listed', metric: (p) => p.metrics && p.metrics.storageGB, best: 'high' },
    { label: 'Graphics', get: (p) => spec(p, 'Graphics') || 'Not listed', metric: (p) => p.metrics && p.metrics.gpuTier, best: 'high' },
    { label: 'Display', get: (p) => spec(p, 'Display') || 'Not listed', metric: null },
    { label: 'Battery', get: (p) => spec(p, 'Battery') || 'Not listed', metric: (p) => p.metrics && p.metrics.batteryHrs, best: 'high' },
    { label: 'Weight', get: (p) => spec(p, 'Weight') || 'Not listed', metric: (p) => p.metrics && p.metrics.weightKg, best: 'low' },
    { label: 'Warranty', get: (p) => p.warranty || 'Not listed', metric: null },
    { label: 'Availability', get: (p) => availability(p).label, metric: null },
  ];
  function rowWinners(items, row) {
    if (!row.metric) return [];
    const vals = items.map((p) => row.metric(p));
    if (vals.some((v) => !has(v))) return [];
    const best = row.best === 'low' ? Math.min(...vals) : Math.max(...vals);
    if (vals.every((v) => v === best)) return [];
    return items.filter((_, i) => vals[i] === best).map((p) => p.id);
  }
  const PHRASE = {
    gpuTier: (w, r) => (w.metrics.gpuTier > r.metrics.gpuTier ? `stronger graphics (${spec(w, 'Graphics')} vs ${spec(r, 'Graphics')})` : null),
    cpuTier: (w, r) => (w.metrics.cpuTier > r.metrics.cpuTier ? `a higher-class processor (${spec(w, 'Processor')} vs ${spec(r, 'Processor')})` : null),
    ramGB: (w, r) => (w.metrics.ramGB > r.metrics.ramGB ? `more RAM (${w.metrics.ramGB}GB vs ${r.metrics.ramGB}GB)` : null),
    storageGB: (w, r) => (w.metrics.storageGB > r.metrics.storageGB ? `more storage (${spec(w, 'Storage')} vs ${spec(r, 'Storage')})` : null),
    displayInches: (w, r) => (w.metrics.displayInches > r.metrics.displayInches ? `a bigger screen (${w.metrics.displayInches}" vs ${r.metrics.displayInches}")` : null),
    batteryHrs: (w, r) => (w.metrics.batteryHrs > r.metrics.batteryHrs ? `longer listed battery life (${w.metrics.batteryHrs}h vs ${r.metrics.batteryHrs}h)` : null),
    weightKg: (w, r) => (w.metrics.weightKg < r.metrics.weightKg ? `lighter to carry (${w.metrics.weightKg}kg vs ${r.metrics.weightKg}kg)` : null),
    price: (w, r) => (priceOf(w) < priceOf(r) ? `${fmt(priceOf(r) - priceOf(w))} cheaper` : null),
  };
  const USE_METRICS = {
    gaming: ['gpuTier', 'cpuTier', 'ramGB'],
    create: ['ramGB', 'cpuTier', 'storageGB', 'displayInches', 'gpuTier'],
    study: ['batteryHrs', 'weightKg', 'price'],
    work: ['batteryHrs', 'ramGB', 'cpuTier', 'weightKg'],
  };
  const USE_LABEL = { gaming: 'Gaming', create: 'Creative work', study: 'Study and everyday use', work: 'Office productivity' };
  function metricVal(p, k) { return k === 'price' ? priceOf(p) : p.metrics && p.metrics[k]; }
  function verdict(items) {
    if (items.length < 2 || items.some((p) => p.category !== 'laptop')) return null;
    const out = [];
    for (const use of ['gaming', 'create', 'study', 'work']) {
      const sc = items.map((p) => ({ p, s: fitScore(p, use) })).sort((a, b) => b.s - a.s);
      const [w, r] = [sc[0], sc[1]];
      if (w.s - r.s < 0.03) { out.push({ use, label: USE_LABEL[use], winner: null, why: 'Too close to call on the listed specs.' }); continue; }
      const bits = [];
      for (const k of USE_METRICS[use]) {
        if (has(metricVal(w.p, k)) && has(metricVal(r.p, k))) {
          const ph = PHRASE[k](w.p, r.p);
          if (ph) bits.push(ph);
        }
      }
      out.push({
        use, label: USE_LABEL[use], winner: w.p.id,
        why: bits.length ? `${w.p.name} wins over ${r.p.name} with ${bits.slice(0, 3).join(', ')}.` : `${w.p.name} scores higher overall on the listed specs.`,
      });
    }
    const vals = items.map((p) => ({ p, v: (['gaming', 'create', 'study', 'work'].reduce((a, u) => a + fitScore(p, u), 0) / 4) / Math.max(priceOf(p) / 1e6, 0.1) })).sort((a, b) => b.v - a.v);
    out.push({ use: 'value', label: 'Best value for money', winner: vals[0].p.id, why: `${vals[0].p.name} gives the most all-round capability per shilling among these.` });
    return out;
  }

  const BUNDLES = {
    student: { id: 'student', name: 'STUDENT', blurb: 'Light, long-lasting, easy on the wallet.', use: 'study', slots: [['laptop', 'Laptop'], ['mouse', 'Mouse'], ['bag', 'Bag'], ['headphones', 'Headphones'], ['storage', 'External storage']] },
    gamer: { id: 'gamer', name: 'GAMER', blurb: 'Frames, feel and a cooler laptop.', use: 'gaming', slots: [['laptop', 'Gaming laptop'], ['mouse', 'Gaming mouse'], ['keyboard', 'Keyboard'], ['headphones', 'Headset'], ['cooling', 'Cooling pad']] },
    creator: { id: 'creator', name: 'CREATOR', blurb: 'Power, a proper screen and room for projects.', use: 'create', slots: [['laptop', 'Powerful laptop'], ['monitor', 'Monitor'], ['mouse', 'Mouse'], ['keyboard', 'Keyboard'], ['headphones', 'Headphones'], ['storage', 'Storage']] },
  };

  return { fmt, priceOf, spec, availability, parseBudget, parseUse, parseCategory, fitScore, reasons, search, rank, compat, accessoriesFor, ROWS, rowWinners, verdict, BUNDLES, USE_LABEL, has, clip };
});
</script>

function bindHome() {
  let fuse = 'study', fbud = 2500000;
  const fRender = () => {
    const list = ERI.rank(S.products, { use: fuse, budget: fbud, priority: fuse === 'study' ? 'portable' : null }).slice(0, 3);
    $('#fOut').innerHTML = list.length ? `<div class="grid">${list.map((p) => cardHtml(p, ERI.reasons(p, fuse, fbud))).join('')}</div>` : `<div class="empty"><p><b>Nothing available at that budget.</b> Try a higher one.</p></div>`;

/* ---------- setup builder ---------- */
function setupDefaults(b, budget) {
  const sel = {}; let left = budget;
  b.slots.forEach(([cat], i) => {
    const pool = S.products.filter((p) => p.category === cat && availability(p).key !== 'out');
    const ranked = pool.map((p) => ({ p, s: ERI.fitScore(p, b.use) })).sort((x, y) => y.s - x.s || priceOf(x.p) - priceOf(y.p)).map((x) => x.p);
    let cap = Infinity;
    if (budget) cap = i === 0 ? budget * 0.6 : Math.max((budget - (sel[0] ? priceOf(byId(sel[0])) : 0)) / (b.slots.length - 1), 0);
    sel[i] = (ranked.find((p) => priceOf(p) <= cap) || (budget ? null : ranked[0]) || null)?.id || null;
  });
  return sel;
}

    const p = chosen[i]; const c = p && laptop && i > 0 ? ERI.compat(laptop, p) : null;
    return `<div class="slot">${p ? art(p) : `<div class="art">${artSvg(cat, 'e')}</div>`}<div><b>${esc(label)}</b>
      <select class="sel" data-sslot="${i}" aria-label="${esc(label)}"><option value="">Skip this</option>${pool.map((x) => `<option value="${esc(x.id)}" ${p && x.id === p.id ? 'selected' : ''}>${esc(x.name)}: ${fmt(priceOf(x))}</option>`).join('')}</select>
      ${p ? `<div style="margin-top:6px">${priceHtml(p)}</div>` : '<p class="muted">Nothing chosen.</p>'}
      ${c ? `<div class="compat ${c.status}"><span class="dot ${c.status}"></span>${c.status === 'ok' ? 'Compatible' : c.status === 'no' ? 'Problem' : 'Not confirmed'}: ${esc(c.note)}</div>` : ''}</div></div>`;
  }).join('');
  const ups = [];
  if (st.budget) b.slots.forEach(([cat], i) => {
    const cur = chosen[i]; if (!cur) return;
    const better = S.products.filter((p) => p.category === cat && availability(p).key !== 'out' && priceOf(p) > priceOf(cur) && ERI.fitScore(p, b.use) > ERI.fitScore(cur, b.use) && total + priceOf(p) - priceOf(cur) <= st.budget).sort((x, y) => ERI.fitScore(y, b.use) - ERI.fitScore(x, b.use))[0];
    if (better) ups.push({ i, cur, better });
  });
  return `<section class="sec sec--dots"><div class="wrap"><h1>BUILD MY SETUP</h1>
  <div class="row" style="margin:16px 0">${Object.values(ERI.BUNDLES).map((x) => `<a class="chip ${x.id === key ? 'on' : ''}" href="#/setup/${x.id}" style="text-decoration:none">${x.name}</a>`).join('')}</div><p style="font-weight:700">${b.blurb}</p>
  <div class="tool" style="margin:16px 0"><div class="field"><label>Budget for the whole setup (optional)</label><div class="row">${[['No limit', ''], ['UGX 2.5M', 2500000], ['UGX 4M', 4000000], ['UGX 6M', 6000000], ['UGX 8M', 8000000]].map(([t, v]) => `<button class="chip" data-sbud="${v}" aria-pressed="${(st.budget ?? '') === v}">${t}</button>`).join('')}</div></div></div>
  <div style="display:grid;gap:14px">${slots}</div>
  ${ups.length ? `<h2 style="margin:28px 0 12px;font-size:1.6rem">UPGRADES WITHIN YOUR BUDGET</h2><div class="grid">${ups.slice(0, 3).map((u) => `<div class="notice"><b>${esc(u.cur.name)}</b> to <b>${esc(u.better.name)}</b><p>+${fmt(priceOf(u.better) - priceOf(u.cur))}</p><button class="btn btn--sm" data-up="${u.i}:${esc(u.better.id)}">Swap it in</button></div>`).join('')}</div>` : ''}
  ${st.budget && total > st.budget ? `<div class="notice" style="margin-top:16px"><b>Over budget by ${fmt(total - st.budget)}.</b> Swap something to a cheaper option.</div>` : ''}
  <div class="totalbar" style="margin-top:24px"><div><small>Running total</small><div class="price">${fmt(total)}</div></div><button class="btn" data-addbundle="${key}" ${chosen.some(Boolean) ? '' : 'disabled'}>Add bundle to cart</button></div></div></section>${footer()}`;
}

/* ---------- checkout ---------- */
function pageCheckout() {
  const ls = cartLines();
  if (!ls.length) return `<section class="sec"><div class="wrap"><div class="empty"><h3>Your cart is empty</h3><a class="btn" href="#/shop">Browse products</a></div></div></section>`;
  if (!S.checkoutStarted) { S.checkoutStarted = true; track('checkout_started', { total: cartTotal() }); }
  const z0 = S.zones[0];
  return `<section class="sec"><div class="wrap" style="max-width:900px"><h1 style="font-size:clamp(2rem,7vw,4rem)">CHECKOUT</h1>
  <div class="notice notice--y" style="margin:16px 0"><b>No payment is taken on this page.</b> We record your order and the team confirms delivery and payment with you. Online mobile money isn't connected yet.</div>
  <form id="coForm" novalidate><div class="field"><label for="cName">Full name</label><input id="cName" name="name" autocomplete="name" required></div>
  <div class="field"><label for="cPhone">Phone (WhatsApp if possible)</label><input id="cPhone" name="phone" type="tel" autocomplete="tel" placeholder="+256 7XX XXX XXX" required></div>
  <div class="field"><label for="cZone">Delivery</label><select id="cZone" name="zone">${S.zones.map((z) => `<option value="${esc(z.id)}">${esc(z.name)}: ${z.fee === null ? 'fee confirmed by the team' : z.fee === 0 ? 'free' : fmt(z.fee)}</option>`).join('')}</select></div>
  <div class="field" id="addrWrap"><label for="cAddr">Address or landmark</label><input id="cAddr" name="address" autocomplete="street-address"></div>
  <div class="field"><label for="cNotes">Notes (optional)</label><textarea id="cNotes" name="notes" rows="2"></textarea></div>
  <fieldset class="field" style="border:0;padding:0"><legend style="font-weight:700;margin-bottom:6px">Payment</legend>${S.pays.map((m, i) => `<label class="notice" style="display:flex;gap:10px;margin-bottom:8px;${m.enabled ? '' : 'opacity:.6'}"><input type="radio" name="payment" value="${esc(m.id)}" ${m.enabled ? '' : 'disabled'} ${m.enabled && !S.pays.slice(0, i).some((x) => x.enabled) ? 'checked' : ''}><span><b>${esc(m.label)}</b><br><small>${esc(m.note || '')}</small></span></label>`).join('')}</fieldset>
  <div class="tool"><h3>Order summary</h3>${ls.map((l) => `<div class="row" style="justify-content:space-between"><span>${l.qty} x ${esc(l.p.name)}</span><span>${fmt(priceOf(l.p) * l.qty)}</span></div>`).join('')}<hr><div class="row" style="justify-content:space-between"><span>Subtotal</span><b>${fmt(cartTotal())}</b></div><div class="row" style="justify-content:space-between"><span>Delivery</span><b id="coFee"></b></div><div class="row" style="justify-content:space-between"><span>Total now</span><b class="price" id="coTotal"></b></div></div>
  <div id="coErr" role="alert" style="margin:12px 0;font-weight:700"></div><button class="btn" type="submit" id="coBtn">Place order</button></form></div></section>${footer()}`;
}
function bindCheckout() {
  const f = $('#coForm'); if (!f) return;
  const upd = () => { const z = S.zones.find((x) => x.id === f.zone.value) || {}; $('#coFee').textContent = z.fee === null ? 'To be confirmed' : z.fee === 0 ? 'Free' : fmt(z.fee); $('#coTotal').textContent = fmt(cartTotal() + (z.fee || 0)) + (z.fee === null ? ' + delivery' : ''); $('#addrWrap').hidden = z.id === 'pickup'; };
  f.zone.onchange = upd; upd();
  f.onsubmit = async (e) => {
    e.preventDefault(); const btn = $('#coBtn'); btn.disabled = true; $('#coErr').textContent = '';
    const pay = f.querySelector('input[name=payment]:checked');
    const body = { name: f.name.value, phone: f.phone.value, zone: f.zone.value, address: f.address.value, notes: f.notes.value, payment: pay && pay.value, items: S.cart };
    try {
      const r = await fetch('/api/orders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json();
      if (!r.ok) { $('#coErr').innerHTML = (j.errors || [j.error]).map(esc).join('<br>'); btn.disabled = false; return; }
      S.lastOrder = j; S.ordered = true; S.cart = []; saveCart(); track('purchase_completed', { id: j.id, total: j.total }); location.hash = '#/done';
    } catch { $('#coErr').textContent = 'Could not reach the server. Your cart is saved. Try again.'; btn.disabled = false; }
  };
}
function pageDone() {
  const o = S.lastOrder; if (!o) return `<section class="sec"><div class="wrap"><a class="btn" href="#/">Back to the shop</a></div></section>`;
  const msg = `Hi ERISAF, I placed order ${o.id} (${o.lines.map((l) => l.qty + ' x ' + l.name).join(', ')}). Total ${fmt(o.total)}${o.feeConfirmed ? '' : ' plus delivery'}.`;
  return `<section class="sec sec--y"><div class="wrap" style="max-width:760px"><h1>ORDER RECEIVED.</h1><p style="font-weight:700;margin:14px 0">Reference <b>${esc(o.id)}</b>. Status: awaiting confirmation. Payment: not yet paid.</p>
  <div class="tool"><p>The team will contact ${esc(o.customer.name)} on ${esc(o.customer.phone)} to confirm ${o.feeConfirmed ? 'payment' : 'the delivery fee and payment'}.</p>${o.lines.some((l) => l.sample) ? '<p class="notice">This order contains sample catalogue items, so it is a test order.</p>' : ''}<div class="row">${waButton(msg, 'Confirm on WhatsApp', 'btn')}<a class="btn btn--white" href="#/">Keep exploring</a></div></div></div></section>${footer()}`;
}
const pageNotFound = () => `<section class="sec"><div class="wrap"><div class="empty"><h2>NOT FOUND</h2><p>That page or product doesn't exist.</p><a class="btn" href="#/">Back home</a></div></div></section>`;

/* ---------- router ---------- */
let keepScroll = false;
function route() {
  const raw = location.hash.slice(1) || '/'; const [path, qs] = raw.split('?'); const q = new URLSearchParams(qs || ''); const seg = path.split('/').filter(Boolean);
  let html, after;
  const r = seg[0] || 'home';
  if (r === 'home') { html = pageHome(); after = bindHome; track('homepage_visit'); }
  else if (r === 'mission') html = pageMission(seg[1]);
  else if (r === 'shop') html = pageShop(q);
  else if (r === 'p') html = pageProduct(decodeURIComponent(seg[1] || ''));
  else if (r === 'compare') html = pageCompare(q);
  else if (r === 'quiz') html = pageQuiz();
  else if (r === 'budget') { html = pageBudget(); after = bindBudget; }
  else if (r === 'setup') html = pageSetup(seg[1] || 'student');
  else if (r === 'checkout') { html = pageCheckout(); after = bindCheckout; }
  else if (r === 'done') html = pageDone();
  else html = pageNotFound();
  const y = window.scrollY; app.innerHTML = html; if (after) after();
  if (keepScroll) window.scrollTo(0, y); else { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
  keepScroll = false; closeCart();
  $$('.bottombar [data-nav]').forEach((a) => a.classList.toggle('on', a.dataset.nav === (r === 'home' ? 'home' : r)));
  renderCompareBar(); if (!$('#assistant').hidden) renderChat();
}
const rerender = () => { keepScroll = true; route(); };

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = (s) => e.target.closest(s);
  let el;
  if ((el = t('[data-add]'))) { addToCart(el.dataset.add); return; }
  if ((el = t('[data-cmp]'))) { toggleCompare(el.dataset.cmp); return; }
  if (t('[data-cmp-open]')) { const m = location.hash.match(/#\/p\/(.+)$/); if (m) { if (!S.compare.includes(m[1])) toggleCompare(m[1]); toast('Now pick another laptop to compare, then tap "Which one wins?"'); location.hash = '#/shop?cat=laptop'; } return; }
  if ((el = t('[data-ask]'))) { openChat(el.dataset.ask || ''); return; }
  if ((el = t('[data-say]'))) { say(el.dataset.say); return; }
  if (t('[data-close-chat]')) { closeChat(); return; }
  if (t('[data-close-cart]')) { closeCart(); return; }
  if ((el = t('[data-qty]'))) { const l = S.cart.find((x) => x.id === el.dataset.qty); if (l) { l.qty = Math.max(1, l.qty + +el.dataset.d); saveCart(); renderCart(); } return; }
  if ((el = t('[data-rm]'))) { S.cart = S.cart.filter((x) => x.id !== el.dataset.rm); saveCart(); renderCart(); return; }
  if ((el = t('[data-mb]'))) { S.mission.budget = el.dataset.mb ? +el.dataset.mb : null; rerender(); return; }
  if ((el = t('[data-mp]'))) { S.mission.priority = el.dataset.mp || null; rerender(); return; }
  if ((el = t('[data-qa]'))) { const st = QUIZ[S.quiz.step]; const raw = el.dataset.qa; S.quiz.a[st.k] = st.k === 'budget' ? +raw : raw; S.quiz.step++; rerender(); window.scrollTo(0, 0); return; }
  if (t('[data-qback]')) { S.quiz.step = Math.max(0, S.quiz.step - 1); rerender(); return; }
  if (t('[data-qrestart]')) { S.quiz = { step: 0, a: {} }; rerender(); return; }
  if ((el = t('[data-sbud]'))) { const k = location.hash.split('/')[2]; const b = ERI.BUNDLES[k]; const st = S.setup[k]; st.budget = el.dataset.sbud ? +el.dataset.sbud : null; st.sel = setupDefaults(b, st.budget); rerender(); return; }
  if ((el = t('[data-up]'))) { const k = location.hash.split('/')[2]; const [i, id] = el.dataset.up.split(':'); S.setup[k].sel[i] = id; rerender(); return; }
  if ((el = t('[data-addbundle]'))) { const k = el.dataset.addbundle; const ids = Object.values(S.setup[k].sel).filter(Boolean); ids.forEach((id) => addToCart(id, 1, true)); track('bundle_added', { bundle: k }); toast(`${ids.length} items added to cart`); openCart(); return; }
  if (t('#cartBtn') || t('#cartBtn2')) { openCart(); return; }
  if (t('#scrim')) { closeCart(); closeChat(); return; }
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('[data-sslot]'); if (s) { const k = location.hash.split('/')[2]; S.setup[k].sel[s.dataset.sslot] = s.value || null; rerender(); return; }
  const c = e.target.closest('[data-slot]'); if (c) { const v = $$('[data-slot]').map((x) => x.value).filter(Boolean); location.hash = '#/compare?ids=' + [...new Set(v)].join(','); }
});
$('#fab').onclick = () => openChat(); $('#closeAssistant').onclick = closeChat;
$('#chatForm').onsubmit = (e) => { e.preventDefault(); const i = $('#chatIn'); const v = i.value; i.value = ''; say(v); };
$('#searchForm').onsubmit = (e) => { e.preventDefault(); const v = $('#q').value.trim(); if (v) location.hash = '#/shop?q=' + encodeURIComponent(v); };
window.addEventListener('hashchange', route);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCart(); if (!$('#assistant').hidden) closeChat(); } });

/* ---------- boot ---------- */
(async function init() {
  try {
    const r = await fetch('/api/catalogue'); const j = await r.json();
    S.products = j.products; S.store = j.store || {}; S.zones = j.deliveryZones || []; S.pays = j.paymentMethods || []; S.policies = j.policies || {}; S.aiMode = j.assistantMode;
  } catch { app.innerHTML = '<section class="sec"><div class="empty"><h2>CAN\'T LOAD THE SHOP</h2><p>Check your connection and refresh.</p></div></section>'; return; }
  S.cart = S.cart.filter((l) => byId(l.id));
  if (S.products.some((p) => p.sample)) $('#sampleBar').hidden = false;
  const wa = waLink('Hi ERISAF, I have a question.'); if (wa) { $('#waTop').href = wa; $('#waTop').hidden = false; }
  saveCart(); route();
  window.__ERISAF = S; // handy for debugging in the console
})();
})();
</script>
</body>
</html>
